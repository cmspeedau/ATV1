# Whole-disk image for the ATV1 (MBR/dos layout — the loader chainloads BIOS).
#
# P1: FAT16 boot/ESP  — bzImage + EFI/boot/bootia32.efi  (label: ATV1BOOT)
# P2: ext4 rootfs     — the Buildroot root filesystem
#
# NOTE: keep bootable flag + MBR (hdimage) — do not hand-fdisk, genimage
# writes both the partition table and the boot indicators consistently.

image boot.vfat {
        vfat {
                # genimage 9 (this era) has no vfat 'label' option —
                # the volume name goes to mkdosfs via extraargs instead.
                extraargs = "-n ATV1BOOT"
                files = {
                        "bzImage",
                        "EFI",
                }
        }
        size = 32M
}

image rootfs-data.ext4 {
        ext4 {
                # genimage 9 ext4 section knows only 'label' — an
                # earlier draft of this file had a made-up
                # 'use-inode-count' option; option surface verified
                # against the built source, 2026-10-27.
                label = "ATV1DATA"
        }
        size = 64M
}

image atv1-disk.img {
        hdimage {
        }

        partition boot {
                partition-type = 0xC
                bootable = "true"
                image = "boot.vfat"
        }

        partition rootfs {
                partition-type = 0x83
                bootable = "false"
                image = "rootfs.ext4"
        }

        # P3: persistent data — managed media root, sync manifest, update
        # journal, diagnostics. Survives rootfs re-imaging (that re-image
        # model IS the A1218 recovery story per ARCHITECTURE doc §4: no
        # OTA slot switching on the stock Apple boot chain).
        # Small on the dev stick; grow with growpart-free `fdisk`/`sgdisk`
        # + resize2fs on the internal 2 TB at install time.
        partition data {
                partition-type = 0x83
                bootable = "false"
                image = "rootfs-data.ext4"
        }
}
