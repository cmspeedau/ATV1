# Whole-disk image for the ATV1 (MBR/dos layout — the loader chainloads BIOS).
#
# P1: FAT16 boot/ESP  — bzImage + EFI/boot/bootia32.efi  (label: ATV1BOOT)
# P2: ext4 rootfs     — the Buildroot root filesystem
#
# NOTE: keep bootable flag + MBR (hdimage) — do not hand-fdisk, genimage
# writes both the partition table and the boot indicators consistently.

image boot.vfat {
        vfat {
                # genimage 9 (this era) has no vfat 'label' option —
                # the volume name goes to mkdosfs via extraargs instead.
                extraargs = "-n ATV1BOOT"
                files = {
                        "bzImage",
                        "EFI",
                }
        }
        size = 32M
}

# buildroot's own ext4 rootfs, embedded as-is: the file handler takes
# the pre-built file from inputpath (BINARIES_DIR), size = file size.
# Declared explicitly rather than leaning on any undeclared-name
# fallback — one mechanism, verified in v9's source.
image rootfs.ext4 {
        file {
                copy = false
        }
}

# P3 data fs: EMPTY ext4, label ATV1DATA — so genimage cannot make it.
# An ext4 image block here would get its content from `cp -a --rootpath`,
# and buildroot's genimage.sh sets --rootpath to the ENTIRE target rootfs
# (that is what made genext2fs hit ENOSPC inside 64M, 2026-10-27; v9 has
# no usable per-image mountpoint — the plumbing exists, the config option
# doesn't). So post-image.sh formats atv1-data.ext4 with
# `mkfs.ext4 -L ATV1DATA` into BINARIES_DIR and the file handler embeds
# it as-is. S20datadirs fills it with the Kodi directories on first boot.
image rootfs-data.ext4 {
        file {
                name = "atv1-data.ext4"
                copy = false
        }
}

image atv1-disk.img {
        hdimage {
        }

        partition boot {
                partition-type = 0xC
                bootable = "true"
                image = "boot.vfat"
        }

        partition rootfs {
                partition-type = 0x83
                bootable = "false"
                image = "rootfs.ext4"
        }

        # P3: persistent data — managed media root, sync manifest, update
        # journal, diagnostics. Survives rootfs re-imaging (that re-image
        # model IS the A1218 recovery story per ARCHITECTURE doc §4: no
        # OTA slot switching on the stock Apple boot chain).
        # Small on the dev stick; grow with growpart-free `fdisk`/`sgdisk`
        # + resize2fs on the internal 2 TB at install time.
        partition data {
                partition-type = 0x83
                bootable = "false"
                image = "rootfs-data.ext4"
        }
}
