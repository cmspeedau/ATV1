# Same menu for the legacy BIOS/chainload path (classic atv-boot-loader).
# Only used if you drop GRUB2 EFI for grub-legacy (README §5 fallback).

set timeout=3
set default=0

menuentry 'ATV1 (internal disk)' {
        root (hd0,0)
        kernel /bzImage root=/dev/sda2 rootwait rootdelay=2 rw quiet console=tty1 console=ttyS0,57600
}

menuentry 'ATV1 (USB stick)' {
        root (hd1,0)
        kernel /bzImage root=/dev/sdb2 rootwait rootdelay=3 rw quiet console=tty1 console=ttyS0,57600
}
