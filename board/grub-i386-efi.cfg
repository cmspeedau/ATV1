# GRUB config embedded into the ia32 EFI image.
# bzImage + ESP are partition 1 (msdos); rootfs is partition 2.
# Device naming differs between internal SATA (sda) and USB sticks
# (sdb/sdc depending on hub/ports), so we offer explicit entries.
# The kernel console= pair gives video + the onboard UART header.

set timeout=3
set default=0

menuentry 'ATV1 (internal disk)' {
        linux /bzImage root=/dev/sda2 rootwait rootdelay=2 rw quiet console=tty1 console=ttyS0,57600
}

menuentry 'ATV1 (USB stick)' {
        linux /bzImage root=/dev/sdb2 rootwait rootdelay=3 rw quiet console=tty1 console=ttyS0,57600
}

menuentry 'ATV1 (USB stick via hub)' {
        linux /bzImage root=/dev/sdc2 rootwait rootdelay=3 rw quiet console=tty1 console=ttyS0,57600
}

menuentry 'ATV1 (debug: serial only, verbose)' {
        linux /bzImage root=/dev/sda2 rootwait rootdelay=2 rw console=ttyS0,57600
}
